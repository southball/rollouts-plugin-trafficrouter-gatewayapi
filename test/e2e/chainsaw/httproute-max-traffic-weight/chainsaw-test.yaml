apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: httproute-max-traffic-weight
  labels:
    route-type: http
spec:
  description: >
    Verifies HTTPRoute traffic splitting with a custom maximum traffic weight.
  namespace: default
  concurrent: true
  steps:
    - name: create-resources
      try:
        - apply:
            file: resources/services.yaml
        - apply:
            file: resources/httproute.yaml
        - apply:
            file: resources/rollout.yaml

    - name: assert-initial-state
      try:
        - assert:
            timeout: 30s
            file: assertions/httproute-initial.yaml

    - name: wait-for-initial-healthy
      try:
        - assert:
            timeout: 5m
            file: assertions/rollout-healthy.yaml

    - name: trigger-canary
      try:
        - patch:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Rollout
              metadata:
                name: httproute-max-weight-rollout
                namespace: default
              spec:
                template:
                  spec:
                    containers:
                      - name: rollouts-demo
                        image: argoproj/rollouts-demo:green

    - name: assert-custom-canary-weight
      try:
        - assert:
            timeout: 2m
            file: assertions/httproute-canary.yaml

    - name: assert-rollout-healthy
      try:
        - assert:
            timeout: 5m
            file: assertions/rollout-healthy.yaml

    - name: assert-cleanup
      try:
        - assert:
            timeout: 60s
            file: assertions/httproute-after-cleanup.yaml
