apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httproute-max-weight
  namespace: default
spec:
  (length(rules)): 1
  rules:
    - backendRefs:
        - name: max-weight-stable-service
          (weight): 100000
        - name: max-weight-canary-service
          (weight): 0
