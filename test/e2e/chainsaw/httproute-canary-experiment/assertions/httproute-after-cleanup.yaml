apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httproute-canary-experiment
  namespace: default
spec:
  (length(rules)): 1
  rules:
    - (length(backendRefs)): 2
      backendRefs:
        - name: httproute-canary-experiment-stable-service
          (weight): 100
        - name: httproute-canary-experiment-canary-service
          (weight): 0
